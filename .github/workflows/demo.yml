name: webapp test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: pr-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          echo "SERVER_PORT=8800" >> $GITHUB_ENV
          echo "DB_USERNAME=root" >> $GITHUB_ENV  
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
          echo "DB_DATABASE=${{ secrets.DB_DATABASE }}" >> $GITHUB_ENV
          echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "DB_PORT=3306" >> $GITHUB_ENV

      - name: Install MySQL
        run: |
          sudo apt update
          sudo apt install -y mysql-server
          sudo systemctl start mysql
          sudo systemctl enable mysql

      - name: Configure MySQL Root Authentication
        run: |
          sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '${{ secrets.DB_PASSWORD }}';"
          sudo mysql -e "FLUSH PRIVILEGES;"
          sudo systemctl restart mysql

      - name: Set Up Database
        run: |
          mysql -u root --password=${{ secrets.DB_PASSWORD }} -e "CREATE DATABASE IF NOT EXISTS \`${{ secrets.DB_DATABASE }}\`;"
          mysql -u root --password=${{ secrets.DB_PASSWORD }} -e "GRANT ALL PRIVILEGES ON \`${{ secrets.DB_DATABASE }}\`.* TO 'root'@'%' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}';"
          mysql -u root --password=${{ secrets.DB_PASSWORD }} -e "FLUSH PRIVILEGES;"

      - name: Wait for MySQL to be Ready
        run: |
          echo "Waiting for MySQL to start..."
          for i in {30..0}; do
            if mysqladmin ping -h 127.0.0.1 -u root --password=${{ secrets.DB_PASSWORD }} --silent; then
              echo "MySQL is ready!"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test
