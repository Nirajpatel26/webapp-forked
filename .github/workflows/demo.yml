name: webapp test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: pr-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          echo "SERVER_PORT=8800" >> $GITHUB_ENV
          echo "DB_USERNAME=root" >> $GITHUB_ENV  
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
          echo "DB_DATABASE=${{ secrets.DB_DATABASE }}" >> $GITHUB_ENV
          echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "DB_PORT=3306" >> $GITHUB_ENV

      - name: Start MySQL Container
        run: |
          docker run --name mysql-container -e MYSQL_ROOT_PASSWORD=${{ secrets.DB_PASSWORD }} \
          -p 3306:3306 -d mysql:8.0

      - name: Wait for MySQL to be Ready
        run: |
          echo "Waiting for MySQL to start..."
          for i in {30..0}; do
            if mysqladmin ping -h 127.0.0.1 -u root --password=${{ secrets.DB_PASSWORD }} --silent; then
              echo "MySQL is ready!"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Set Up Database with Root User
        run: |
          docker exec -i mysql-container mysql -u root --password=${{ secrets.DB_PASSWORD }} -e "CREATE DATABASE IF NOT EXISTS \`${{ secrets.DB_DATABASE }}\`;"
          docker exec -i mysql-container mysql -u root --password=${{ secrets.DB_PASSWORD }} -e "GRANT ALL PRIVILEGES ON \`${{ secrets.DB_DATABASE }}\`.* TO 'root'@'%';"
          docker exec -i mysql-container mysql -u root --password=${{ secrets.DB_PASSWORD }} -e "FLUSH PRIVILEGES;"

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test
