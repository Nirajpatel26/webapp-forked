name: Web App CI
 
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-tests:
    name: Run Web App Tests
    runs-on: ubuntu-latest
 
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_USERNAME : ${{ secrets.DB_USERNAME }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}  
          MYSQL_DATABASE: ${{ secrets.DB_DATABASE }}  
        ports:
          - 3306:3306
        
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
 
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Verify Database Creation
        run: |
          echo "Checking if database exists..."
          if sudo mysql -u root -p"${{ secrets.DB_PASSWORD }}" -e "SHOW DATABASES LIKE '${{ secrets.DB_DATABASE }}';" | grep "${{ secrets.DB_DATABASE }}"; then
            echo "✅ Database '${{ secrets.DB_DATABASE }}' exists!"
          else
            echo "❌ Database '${{ secrets.DB_DATABASE }}' not found!"
            exit 1
          fi
  
 
      - name: Install Dependencies
        run: npm install
      - name: Run Tests
        run: npm test
        env:
          SERVER_PORT: "8800"
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_HOST: "localhost"
          PORT: "3306"
          