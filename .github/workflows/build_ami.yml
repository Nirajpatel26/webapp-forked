name: Packer Build CI

on:
  push:
    branches: ["A04-1"]
  # pull_request:
  #   branches: ["main"]

jobs:
  build:
    name: packer-build
    runs-on: ubuntu-latest

    env:
          MYSQL_USERNAME : ${{ secrets.DB_USERNAME }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}  
          MYSQL_DATABASE: ${{ secrets.DB_DATABASE }}
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v3


      - name: Create Zip File
        run: |
          zip -r webapp.zip .
        
      - name: List Files
        run: ls -al

      - name: Upload Zip File
        uses: actions/upload-artifact@v4
        with:
          name: webapp zip creation
          path: webapp.zip
          
          
      - name: Move Zip file to Packer Folder 
        run: |
          ls
          pwd
          sudo mv /home/runner/work/webapp-forked/webapp-forked/webapp.zip /home/runner/work/webapp-forked/webapp-forked/packer/



      - name: Run Packer
        run: |
          # Install Packer non-interactively
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install packer -y
          
          # Navigate to packer directory and run build
          cd packer
          packer init webapp.pkr.hcl

          packer build
          -var="aws_region=${{ secrets.AWS_REGION }}" \
          -var="subnet_id=${{ secrets.SUBNET_ID }}" \
          -var="source_ami=${{ secrets.SOURCE_AMI }}" \
          -var="dev_user=${{ secrets.DEV_USER }}" \
          -var="demo_user=${{ secrets.DEMO_USER }}" \
          -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY }}" \
          -var="aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
          -var="security_group_id=${{ secrets.SECURITY_GROUP_ID }}" \
          -var="db_username=${{ secrets.DB_USERNAME }}" \
          -var="db_password=${{ secrets.DB_PASSWORD }}" \
          -var="db_database=${{ secrets.DB_DATABASE }}" \
          webapp.pkr.hcl