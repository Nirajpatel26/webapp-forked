name: Packer Build CI

on:
  pull_request:
    types: [closed]
    branches: ["main"]
  # push:
  #   branches: ["main"]
  #pull_request:
    #branches: ["main"]

jobs:
  build:
    name: packer-build
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_USERNAME : ${{ secrets.DB_USERNAME }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}  
          MYSQL_DATABASE: ${{ secrets.DB_DATABASE }}  
        ports:
          - 3306:3306
  
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Load Environment Variables
        run: |
          echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> $GITHUB_ENV  
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
          echo "DB_DATABASE=${{ secrets.DB_DATABASE }} " >> $GITHUB_ENV
          echo "DB_PORT=3306" >> $GITHUB_ENV
 
      - name: Install Dependencies
        run: npm install
      - name: Run Tests
        run: npm test
        env:
          SERVER_PORT: "8800"
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_HOST: "127.0.0.1"
          PORT: "3306"

      - name: Create Zip File
        run: |
              zip -r webapp.zip .
              cp webapp.zip packer/
              ls -la packer/
        
      - name: List Files
        run: ls -al

      - name: Upload Zip File
        uses: actions/upload-artifact@v4
        with:
          name: webapp zip creation
          path: webapp.zip

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
     
      # - name: Authenticate to Google Cloud
      #   uses: google-github-actions/auth@v1
      #   with:
      #     credentials_json: ${{ secrets.GCP_SA_KEY }}
      #     export_default_credentials: true

      # - name: Set up Cloud SDK
      #   uses: google-github-actions/setup-gcloud@v1
      #   with:
      #     project_id: ${{ secrets.GCP_ACCOUNT_ID }}


      - name: Run Packer
        id: packer_run
        run: |
          # Install Packer non-interactively
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install packer -y
          
          # Navigate to packer directory and run build
          ls
          cd packer
          packer init webapp.pkr.hcl

          packer build \
            -var "aws_region=${{ secrets.AWS_REGION }}" \
            -var "subnet_id=${{ secrets.SUBNET_ID }}" \
            -var "source_ami=${{ secrets.SOURCE_AMI }}" \
            -var "dev_user=${{ secrets.DEV_USER }}" \
            -var "demo_user=${{ secrets.DEMO_USER }}" \
            -var "security_group_id=${{ secrets.SECURITY_GROUP_ID }}" \
            -var "db_username=${{ secrets.DB_EC2_USER }}" \
            -var "db_password=${{ secrets.DB_PASSWORD }}" \
            -var "db_database=${{ secrets.DB_DATABASE }}" \
            -var "server_port=${{ secrets.SERVER_PORT }}" \
            -var "db_host=${{ secrets.DB_HOST }}" \
            webapp.pkr.hcl


      - name: Retrieve Latest AMI and Save AMI_ID
        id: share_ami
        env:
            AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
                  AMI_ID=$(aws ec2 describe-images \
                    --owners self \
                    --filters "Name=name,Values=csye6225_*" "Name=state,Values=available" \
                    --query "sort_by(Images, &CreationDate)[-1].ImageId" \
                    --output text --region "${AWS_REGION}")
 
                  if [[ -n "$AMI_ID" && "$AMI_ID" != "None" ]]; then
                    echo "Found latest AMI: $AMI_ID"
                    echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
                    echo "$AMI_ID" > ami_id.txt
                  else
                    echo "No AMI found, exiting..."
                    exit 1
                  fi
 
      - name: Upload AWS AMI ID Artifact
        uses: actions/upload-artifact@v4
        with:
              name: ami_id
              path: ami_id.txt
              if-no-files-found: error
              retention-days: 1
              overwrite: true

      - name: Cleanup on Failure
        if: failure()
        run: |
              echo "Workflow failed! Cleaning up resources..."
              rm -f ami_id.txt
 
            # Share AMI with DEMO account
      - name: Share AMI with DEMO account
        run: |
                  AMI_ID=$(cat ami_id.txt)
                  echo "AMI_ID=$AMI_ID" >> $GITHUB_ENV
 
                  aws ec2 modify-image-attribute \
                    --image-id $AMI_ID \
                    --launch-permission "Add=[{UserId=${{ secrets.DEMO_AWS_ACCOUNT_ID }}}]"
 
            # Reconfigure AWS CLI for DEMO account
      - name: Configure AWS CLI for DEMO account
        run: |
                  aws configure set aws_access_key_id ${{ secrets.DEMO_GITHUB_ACCESS_KEY }}
                  aws configure set aws_secret_access_key ${{ secrets.DEMO_GITHUB_SECRET_KEY }}
                  aws configure set region ${{ secrets.AWS_REGION }}
 
      - name: Create new Launch Template version
        run: |
                  # First, list all launch templates to verify what we're working with
                  echo "Available Launch Templates:"
                  aws ec2 describe-launch-templates --query 'LaunchTemplates[*].[LaunchTemplateId,LaunchTemplateName]' --output table
 
                  # Get the Launch Template ID using exact name pattern
                  echo "Attempting to find Launch Template..."
                  LAUNCH_TEMPLATE_ID=$(aws ec2 describe-launch-templates \
                    --query 'LaunchTemplates[?starts_with(LaunchTemplateName, `csye6225-asg-instance`)].LaunchTemplateId' \
                    --output text)
 
                  echo "Found Launch Template ID: '$LAUNCH_TEMPLATE_ID'"
 
                  # Validate the Launch Template ID
                  if [ "$LAUNCH_TEMPLATE_ID" == "None" ] || [ -z "$LAUNCH_TEMPLATE_ID" ]; then
                    echo "Error: No Launch Template found!"
                    exit 1
                  fi
 
                  # Verify the Launch Template exists
                  echo "Verifying Launch Template..."
                  aws ec2 describe-launch-templates \
                    --launch-template-ids "$LAUNCH_TEMPLATE_ID" || {
                      echo "Error: Invalid Launch Template ID"
                      exit 1
                    }
 
                  # Get latest version
                  echo "Getting latest version..."
                  LATEST_VERSION=$(aws ec2 describe-launch-template-versions \
                    --launch-template-id "$LAUNCH_TEMPLATE_ID" \
                    --query "LaunchTemplateVersions[0].VersionNumber" \
                    --output text)
 
                  echo "Latest version: $LATEST_VERSION"
 
                  # Create new version
                  AMI_ID=$(cat ami_id.txt)
                  echo "Creating new version with AMI ID: $AMI_ID"
                  aws ec2 create-launch-template-version \
                    --launch-template-id "$LAUNCH_TEMPLATE_ID" \
                    --version-description "Auto-updated by GitHub Actions" \
                    --source-version "$LATEST_VERSION" \
                    --launch-template-data "{\"ImageId\":\"$AMI_ID\"}"
        env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.DEMO_GITHUB_ACCESS_KEY }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.DEMO_GITHUB_SECRET_KEY }}
                  AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Start Instance Refresh
        id: start_refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh --auto-scaling-group-name ${{ secrets.ASG_NAME }} --query 'InstanceRefreshId' --output text)
          echo "refresh_id=$REFRESH_ID" >> $GITHUB_OUTPUT

      - name: Wait for Instance Refresh
        run: |
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name ${{ secrets.ASG_NAME }} --instance-refresh-ids ${{ steps.start_refresh.outputs.refresh_id }} --query 'InstanceRefreshes[0].Status' --output text)
            if [ "$STATUS" = "Successful" ]; then
              echo "Instance refresh completed successfully"
              exit 0
            elif [ "$STATUS" = "Failed" ]; then
              echo "Instance refresh failed"
              exit 1
            else
              echo "Instance refresh in progress. Current status: $STATUS"
              sleep 30
            fi
          done

      # - name: Authenticate to Google Cloud
